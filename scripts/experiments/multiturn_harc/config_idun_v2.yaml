# Multi-turn HARC v2 for Qwen 2.5 7B on idun (M4 Max, 64 GB, MPS)
#
# Fixes from v1 post-mortem (diary #799):
# 1. max_context_len: 768 → 2048 (v1 kept only 18% of avg conversation)
# 2. lr: 5e-5 → 1e-4 (match MS HARC)
# 3. lora_r: 16 → 32, alpha: 32 → 64 (match MS HARC capacity)
# 4. Response coupling enabled (MS HARC's lambda_couple_resp)
# 5. Batch 1+1 with grad_accum=8 to fit 2048-token sequences in memory

model_id: Qwen/Qwen2.5-7B-Instruct
out_dir: runs/multiturn_harc_v2
data_dir: data

# batch — 1+1 for longer sequences, grad_accum=8 → effective batch=16
micro_batch_harmful: 1
micro_batch_benign: 1
grad_accum: 8

# optim — match MS HARC
lr: 1.0e-4
warmup: 100
max_steps: 3000

# lora — match MS HARC
lora_r: 32
lora_alpha: 64

# losses
coupling_margin: 0.5
lambda_couple: 1.0
lambda_couple_resp: 1.0       # NEW: response coupling
lambda_kl: 10.0
lambda_ce: 1.0
response_n_tokens: 32         # NEW: couple over first 32 response tokens

# directions
n_extract: 200
extract_batch_size: 1         # batch_size=1 for MPS NaN workaround
extract_max_len: 256
recompute_every: 500
beta_ema: 0.3

# layers
active_layers: [21, 22, 23, 24, 25]

# sequence — the critical fix: 2048 captures ~49% of conversation content
# vs 768 which captured only 18%
max_context_len: 2048
max_response_len: 256
